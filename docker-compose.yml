services:
  backend:
    build: .
    container_name: hono-app
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
    environment:
      - REDIS_URL=redis://redis:6379
      # Poll for file changes: change events from Windows/macOS bind mounts don't reach the container
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7.4.8-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data

  redis_exporter:
    image: oliver006/redis_exporter:v1.93.0
    container_name: redis_exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      # Cap on-disk history so the volume can't grow unbounded.
      - '--storage.tsdb.retention.time=15d'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.2
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  k6:
    image: grafana/k6:2.3.0
    profiles: ["load"]      # excluded from `docker compose up`; run on demand
    volumes:
      - ./loadgen:/scripts
    command: run /scripts/script.js
    depends_on:
      - backend

volumes:
  prometheus-data:
  grafana-data:
  redis-data: